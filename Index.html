<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Football AI - Live Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#101827',
            cardBg: '#1B2940',
            goldBrand: '#D5A63C',
            successGreen: '#20C987',
            riskRed: '#E05252',
            warningYellow: '#F2C45D',
            infoBlue: '#4B9BEE'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-appBg text-gray-100 min-h-screen font-sans antialiased pb-12" onload="fetchLiveMatches()">

  <header class="bg-cardBg border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div>
      <h1 class="text-xl font-bold text-goldBrand tracking-wide">⚽ Personal Football AI</h1>
      <p class="text-xs text-gray-400">Automated Daily Verified Matches</p>
    </div>
    <div class="text-xs px-2.5 py-1 rounded-full bg-successGreen/20 text-successGreen font-medium flex items-center space-x-1">
      <span class="w-2 h-2 rounded-full bg-successGreen inline-block animate-pulse"></span>
      <span>Auto Live</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <section class="bg-cardBg p-4 rounded-xl border border-gray-800 shadow-md">
      <h2 class="text-sm font-semibold text-goldBrand mb-1">Today's Automated Top Matches</h2>
      <p class="text-xs text-gray-300">Fetched automatically via GitHub Actions & verified multi-source consensus models.</p>
    </section>

    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="text-xs font-bold tracking-wider text-gray-400 uppercase">Top Selections</h3>
        <span id="matchCount" class="text-xs text-goldBrand font-medium">Loading...</span>
      </div>
      <div id="predictionsList" class="space-y-3">
        <!-- Matches will load dynamically here -->
      </div>
    </section>
  </main>

  <script>
    async function fetchLiveMatches() {
      const listEl = document.getElementById('predictionsList');
      const countEl = document.getElementById('matchCount');
      
      try {
        const response = await fetch('matches.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Data not found');
        const matches = await response.json();
        
        listEl.innerHTML = '';
        countEl.innerText = `${matches.length} Matches Loaded`;

        matches.forEach((m) => {
          const homeBadges = m.homeForm.map(f => `<span class="w-4 h-4 rounded ${f==='W'?'bg-successGreen text-white':f==='D'?'bg-warningYellow text-black':'bg-riskRed text-white'} flex items-center justify-center font-bold text-[10px]">${f}</span>`).join('');
          const awayBadges = m.awayForm.map(f => `<span class="w-4 h-4 rounded ${f==='W'?'bg-successGreen text-white':f==='D'?'bg-warningYellow text-black':'bg-riskRed text-white'} flex items-center justify-center font-bold text-[10px]">${f}</span>`).join('');

          const cardHtml = `
            <div class="bg-cardBg p-4 rounded-xl border border-gray-800 shadow-md space-y-3">
              <div class="flex justify-between items-center text-xs text-goldBrand font-medium">
                <span>${m.league}</span>
                <span class="bg-gray-800/80 px-2 py-0.5 rounded text-gray-300">${m.time}</span>
              </div>
              <div class="grid grid-cols-3 items-center py-1.5 cursor-pointer" onclick="toggleStats('${m.id}-details')">
                <div class="flex items-center space-x-2">
                  <img src="${m.homeLogo}" class="w-8 h-8 object-contain shrink-0" onerror="this.src='https://crests.football-data.org/ico.png'">
                  <div class="space-y-1">
                    <div class="font-bold text-sm text-goldBrand truncate">${m.homeTeam}</div>
                    <div class="flex space-x-0.5">${homeBadges}</div>
                  </div>
                </div>
                <div class="text-xs text-gray-400 text-center font-bold">VS<br><span class="text-[9px] text-infoBlue underline">Tap Stats</span></div>
                <div class="flex items-center justify-end space-x-2 text-right">
                  <div class="space-y-1">
                    <div class="font-bold text-sm text-goldBrand truncate">${m.awayTeam}</div>
                    <div class="flex justify-end space-x-0.5">${awayBadges}</div>
                  </div>
                  <img src="${m.awayLogo}" class="w-8 h-8 object-contain shrink-0" onerror="this.src='https://crests.football-data.org/ico.png'">
                </div>
              </div>
              <div class="bg-appBg/70 p-2.5 rounded-lg space-y-1.5 text-xs">
                <div class="flex justify-between font-medium">
                  <span class="text-successGreen">Home: ${m.homeWinProb}%</span>
                  <span class="text-warningYellow">Draw: ${m.drawProb}%</span>
                  <span class="text-infoBlue">Away: ${m.awayWinProb}%</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden flex">
                  <div class="bg-successGreen h-full" style="width: ${m.homeWinProb}%"></div>
                  <div class="bg-warningYellow h-full" style="width: ${m.drawProb}%"></div>
                  <div class="bg-infoBlue h-full" style="width: ${m.awayWinProb}%"></div>
                </div>
              </div>
              <div id="${m.id}-details" class="hidden bg-appBg/95 p-3 rounded-xl space-y-2 text-xs border border-gray-700">
                <div class="text-center font-bold text-goldBrand">📊 Market Consensus & Score</div>
                <div class="flex justify-between bg-cardBg p-2 rounded"><span>Predicted Score:</span><span class="font-bold text-goldBrand">${m.score}</span></div>
                <div class="flex justify-between bg-cardBg p-2 rounded"><span>Over 2.5 Goals:</span><span class="font-bold text-successGreen">${m.over25}</span></div>
                <div class="flex justify-between bg-cardBg p-2 rounded"><span>BTTS:</span><span class="font-bold text-warningYellow">${m.btts}</span></div>
              </div>
            </div>
          `;
          listEl.innerHTML += cardHtml;
        });
      } catch (err) {
        listEl.innerHTML = `<div class="text-center text-xs text-gray-400 p-4">Waiting for automated daily data sync... (Cron job will generate matches.json soon)</div>`;
        countEl.innerText = "Awaiting Sync";
      }
    }

    function toggleStats(id) {
      document.getElementById(id)?.classList.toggle('hidden');
    }
  </script>
</body>
</html>
