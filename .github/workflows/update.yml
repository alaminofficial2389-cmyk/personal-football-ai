name: Daily Football Match Sync

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live Matches & Generate JSON
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          async function getMatches() {
            const today = new Date().toISOString().split("T")[0];
            try {
              const response = await fetch(`https://api-football-v1.p.rapidapi.com/v3/fixtures?date=${today}`, {
                "method": "GET",
                "headers": {
                  "X-RapidAPI-Key": process.env.RAPIDAPI_KEY,
                  "X-RapidAPI-Host": "api-football-v1.p.rapidapi.com"
                }
              });
              const data = await response.json();
              
              let formattedMatches = [];
              if (data.response && data.response.length > 0) {
                formattedMatches = data.response.slice(0, 10).map((m, index) => ({
                  id: "match" + (index + 1),
                  league: m.league.name,
                  time: new Date(m.fixture.date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " BDT",
                  homeTeam: m.teams.home.name,
                  homeLogo: m.teams.home.logo,
                  homeForm: ["W", "W", "D", "W", "W"],
                  awayTeam: m.teams.away.name,
                  awayLogo: m.teams.away.logo,
                  awayForm: ["W", "D", "W", "L", "W"],
                  homeWinProb: 55,
                  drawProb: 25,
                  awayWinProb: 20,
                  over25: "60% (Likely)",
                  btts: "55% (Yes)",
                  score: "2 - 1"
                }));
              } else {
                formattedMatches = [
                  {
                    id: "match1",
                    league: "UEFA Nations League",
                    time: "11:45 PM BDT",
                    homeTeam: "Portugal",
                    homeLogo: "https://crests.football-data.org/765.png",
                    homeForm: ["W", "W", "D", "W", "W"],
                    awayTeam: "Denmark",
                    awayLogo: "https://crests.football-data.org/779.png",
                    awayForm: ["W", "D", "W", "L", "W"],
                    homeWinProb: 62,
                    drawProb: 24,
                    awayWinProb: 14,
                    over25: "64% (Likely)",
                    btts: "55% (Yes)",
                    score: "2 - 1 (Portugal Win)"
                  }
                ];
              }
              
              fs.writeFileSync("matches.json", JSON.stringify(formattedMatches, null, 2));
              console.log("Matches updated successfully!");
            } catch (err) {
              console.error("Error fetching data:", err);
              process.exit(1);
            }
          }
          getMatches();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git commit -m "Auto-update match data for today" || exit 0
          git push
